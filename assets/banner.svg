<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" role="img" aria-label="Vinicius Mendes - produto, Odoo e gestao">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="55%" stop-color="#0c1424"/>
      <stop offset="100%" stop-color="#081018"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff">
        <animate attributeName="stop-color" values="#58a6ff;#3fb950;#a371f7;#58a6ff" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#3fb950">
        <animate attributeName="stop-color" values="#3fb950;#58a6ff;#39d2c0;#3fb950" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#a371f7">
        <animate attributeName="stop-color" values="#a371f7;#58a6ff;#3fb950;#a371f7" dur="11s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0f6fc"/>
      <stop offset="100%" stop-color="#c9d1d9"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <clipPath id="card">
      <rect width="1100" height="340" rx="28"/>
    </clipPath>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#58a6ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1100" height="340" fill="url(#bg)"/>
    <rect width="1100" height="340" fill="url(#grid)"/>

    <circle cx="180" cy="40" r="160" fill="#58a6ff" opacity="0.22" filter="url(#soft)">
      <animate attributeName="cx" values="180;240;180" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.18;0.32;0.18" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="920" cy="280" r="190" fill="#3fb950" opacity="0.18" filter="url(#soft)">
      <animate attributeName="cy" values="280;230;280" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="20" r="140" fill="#a371f7" opacity="0.16" filter="url(#soft)">
      <animate attributeName="cx" values="620;700;620" dur="13s" repeatCount="indefinite"/>
    </circle>

    <rect x="0" y="0" width="1100" height="4" fill="url(#aurora)"/>

    <text x="64" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" fill="#8b949e" letter-spacing="3.2">BRASILIA  |  PRODUTO  +  ODOO</text>

    <text x="64" y="168" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="url(#nameGrad)" letter-spacing="-1.5">Vinicius Mendes</text>

    <text x="64" y="214" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#c9d1d9">odoo  /  customizacao  /  gestao  /  equipe</text>

    <g transform="translate(64, 258)">
      <rect width="132" height="36" rx="18" fill="#161b22" stroke="#30363d"/>
      <circle cx="18" cy="18" r="5" fill="#3fb950">
        <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="34" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" fill="#e6edf3">odoo geral</text>

      <rect x="144" y="0" width="128" height="36" rx="18" fill="#161b22" stroke="#30363d"/>
      <text x="208" y="23" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" fill="#58a6ff">python</text>

      <rect x="284" y="0" width="78" height="36" rx="18" fill="#161b22" stroke="#30363d"/>
      <text x="323" y="23" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" fill="#58a6ff">ts</text>

      <rect x="374" y="0" width="110" height="36" rx="18" fill="#161b22" stroke="#30363d"/>
      <text x="429" y="23" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" fill="#58a6ff">postgres</text>
    </g>

    <g opacity="0.9" filter="url(#glow)">
      <path d="M980 70c40 18 62 58 62 102 0 62-50 108-118 108" fill="none" stroke="url(#aurora)" stroke-width="2" stroke-linecap="round">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
